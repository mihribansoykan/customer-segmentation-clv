[project]
name = "customer-segmentation-clv"
version = "1.0.0"
description = "Customer segmentation (RFM + K-Means) and 6-month customer lifetime value prediction (BG/NBD + Gamma-Gamma vs. LightGBM) on 1M+ real e-commerce transactions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-calamine>=0.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shap>=0.46",
]

[project.scripts]
retail-clv = "retail_clv.pipeline:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_clv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501", "B018", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=retail_clv --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
